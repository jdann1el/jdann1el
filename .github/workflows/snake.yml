name: snake
on:
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch:
  push: { branches: [main] }
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#ff4a1c&color_dots=#ebedf0,#fff3a8,#f4dc3c,#e0b800,#b38f00
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff4a1c&color_dots=#161b22,#4d4200,#8a7600,#c9a900,#f4dc3c
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
